[package]
name = "cosmic-ext-pi"
version = "0.1.0"
edition = "2021"
description = "COSMIC Desktop / libcosmic integration library for Pi RPC"
license = "MIT OR Apache-2.0"

[dependencies]
pi-rpc = { path = "../pi-rpc" }
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = true, features = ["markdown"] }
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
